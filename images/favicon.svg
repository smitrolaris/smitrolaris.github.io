<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#faf6ee"/>

  <!-- Edges: root to mid -->
  <line x1="32" y1="13" x2="16" y2="30" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="13" x2="48" y2="30" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Edges: mid to leaves -->
  <line x1="16" y1="30" x2="9"  y2="49" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="23" y2="49" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="30" x2="41" y2="49" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="30" x2="55" y2="49" stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>

  <!-- Root node -->
  <circle cx="32" cy="13" r="5.5" fill="#3C3489"/>

  <!-- Mid nodes -->
  <circle cx="16" cy="30" r="4" fill="#7F77DD"/>
  <circle cx="48" cy="30" r="4" fill="#7F77DD"/>

  <!-- Leaf nodes -->
  <circle cx="9"  cy="49" r="3" fill="#AFA9EC"/>
  <circle cx="23" cy="49" r="3" fill="#AFA9EC"/>
  <circle cx="41" cy="49" r="3" fill="#AFA9EC"/>
  <circle cx="55" cy="49" r="3" fill="#AFA9EC"/>
</svg>
